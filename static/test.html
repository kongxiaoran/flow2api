<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow2API 模型测试</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e1e1e6; min-height: 100vh; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; margin-bottom: 8px; font-size: 24px; color: #7c8aff; }
.subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 14px; }

.config-bar {
  display: flex; gap: 12px; margin-bottom: 20px; align-items: center;
  background: #1a1b26; padding: 12px 16px; border-radius: 10px; border: 1px solid #2a2b3a;
}
.config-bar label { font-size: 13px; color: #888; white-space: nowrap; }
.config-bar input { flex: 1; background: #0f1117; border: 1px solid #2a2b3a; color: #e1e1e6; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
.config-note { margin-bottom: 20px; font-size: 12px; color: #7f8498; }

.main-layout { display: flex; gap: 20px; }
.sidebar { width: 280px; flex-shrink: 0; }
.content { flex: 1; min-width: 0; }

.model-section { margin-bottom: 16px; }
.section-title {
  font-size: 13px; font-weight: 600; color: #7c8aff; padding: 8px 12px;
  background: #1a1b26; border-radius: 8px 8px 0 0; border: 1px solid #2a2b3a; border-bottom: none;
  cursor: pointer; user-select: none; display: flex; justify-content: space-between; align-items: center;
}
.section-title:hover { background: #1e1f2e; }
.section-title .arrow { transition: transform 0.2s; }
.section-title.collapsed .arrow { transform: rotate(-90deg); }
.model-list {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 0 0 8px 8px;
  max-height: 300px; overflow-y: auto;
}
.model-list.hidden { display: none; }
.model-item {
  padding: 8px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #1e1f2e;
  display: flex; justify-content: space-between; align-items: center;
}
.model-item:last-child { border-bottom: none; }
.model-item:hover { background: #1e1f2e; }
.model-item.active { background: #2a2b5a; color: #7c8aff; }
.model-tag {
  font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 500;
}
.tag-image { background: #1a3a2a; color: #4ade80; }
.tag-video { background: #3a2a1a; color: #fb923c; }

.gen-panel {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 10px; padding: 20px;
}
.gen-panel h3 { font-size: 16px; margin-bottom: 4px; }
.gen-panel .model-info { font-size: 12px; color: #666; margin-bottom: 16px; }

.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
.form-group textarea {
  width: 100%; background: #0f1117; border: 1px solid #2a2b3a; color: #e1e1e6;
  padding: 10px 12px; border-radius: 8px; font-size: 14px; resize: vertical; min-height: 80px;
  font-family: inherit;
}
.form-group textarea:focus { outline: none; border-color: #7c8aff; }
.param-row { display: flex; flex-wrap: wrap; gap: 12px; }
.form-group .param-item { display: flex; flex-direction: column; gap: 4px; min-width: 130px; flex: 1; margin-bottom: 0; }
.param-item span { font-size: 12px; color: #888; }
.param-item select {  width: 100%;
  background: #0f1015; color: #e0e0e0; border: 1px solid #2a2b3a; border-radius: 8px;
  padding: 8px 10px; font-size: 13px;
}
.param-item select:focus { outline: none; border-color: #7c8aff; }
.full-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #888; margin: 0 0 12px; cursor: pointer; }
.param-hint { font-size: 12px; color: #666; margin-top: 6px; }

.image-upload-area {
  border: 2px dashed #2a2b3a; border-radius: 8px; padding: 20px; text-align: center;
  cursor: pointer; transition: border-color 0.2s; position: relative;
}
.image-upload-area:hover { border-color: #7c8aff; }
.image-upload-area.has-images { padding: 10px; }
.image-upload-hint { color: #555; font-size: 13px; }
.image-preview-list { display: flex; gap: 8px; flex-wrap: wrap; }
.image-preview-item {
  position: relative; width: 80px; height: 80px; border-radius: 6px; overflow: hidden;
}
.image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
.image-preview-item .remove-btn {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
  background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%;
  cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;
}

.btn-generate {
  width: 100%; padding: 12px; background: #7c8aff; color: #fff; border: none;
  border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  transition: background 0.2s;
}
.btn-generate:hover { background: #6b79ee; }
.btn-generate:disabled { background: #3a3b5a; cursor: not-allowed; }

.output-panel {
  background: #1a1b26; border: 1px solid #2a2b3a; border-radius: 10px; padding: 20px; margin-top: 16px;
}
.output-panel h3 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-idle { background: #555; }
.status-running { background: #facc15; animation: pulse 1s infinite; }
.status-done { background: #4ade80; }
.status-error { background: #f87171; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.output-log {
  background: #0f1117; border-radius: 8px; padding: 12px; font-size: 13px;
  line-height: 1.6; max-height: 200px; overflow-y: auto; white-space: pre-wrap;
  word-break: break-all; color: #aaa;
}
.output-result { margin-top: 12px; }
.output-result img { max-width: 100%; border-radius: 8px; margin-top: 8px; }
.output-result video { max-width: 100%; border-radius: 8px; margin-top: 8px; }

.model-list::-webkit-scrollbar, .output-log::-webkit-scrollbar { width: 4px; }
.model-list::-webkit-scrollbar-thumb, .output-log::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

@media (max-width: 768px) {
  .main-layout { flex-direction: column; }
  .sidebar { width: 100%; }
  .config-bar { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="container">
  <h1>🧪 Flow2API 模型测试</h1>
  <p class="subtitle">选择模型，输入提示词，测试生成效果</p>

  <div class="config-bar">
    <label>API Key:</label>
    <input type="password" id="apiKey" placeholder="输入 API Key">
    <label>地址:</label>
    <input type="text" id="baseUrl" placeholder="http://localhost:8000" />
  </div>
  <p class="config-note">未填写 API Key 或模型列表加载失败时，会回退到内置候选模型；实际生成前仍需填写有效 API Key。</p>
  <label class="full-toggle"><input type="checkbox" id="showFull"> 显示全部具体模型名（如 gemini-3.1-flash-image-portrait-4k，兼容旧用法；默认只列基础模型，尺寸 / 画幅 / 时长作为参数选择）</label>

  <div class="main-layout">
    <div class="sidebar" id="modelSidebar"></div>
    <div class="content">
      <div class="gen-panel">
        <h3 id="selectedModelName">请选择模型</h3>
        <div class="model-info" id="selectedModelInfo">从左侧列表选择一个模型开始测试</div>

        <div class="form-group">
          <label>提示词 (Prompt)</label>
          <textarea id="promptInput" placeholder="描述你想生成的内容...">一只可爱的橘猫趴在窗台上晒太阳，窗外是樱花盛开的春天</textarea>
        </div>

        <div class="form-group" id="paramGroup" style="display:none;">
          <label>生成参数</label>
          <div class="param-row" id="paramFields"></div>
          <div class="param-hint" id="paramHint"></div>
        </div>

        <div class="form-group" id="imageUploadGroup" style="display:none;">
          <label>上传图片 <span id="imageLimit" style="color:#666;font-size:12px;"></span></label>
          <div class="image-upload-area" id="imageUploadArea">
            <div class="image-upload-hint" id="imageHint">点击或拖拽上传图片</div>
            <div class="image-preview-list" id="imagePreviewList"></div>
          </div>
          <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none;">
        </div>

        <button class="btn-generate" id="btnGenerate" disabled>选择模型后开始生成</button>
      </div>

      <div class="output-panel">
        <h3><span class="status-dot status-idle" id="statusDot"></span> <span id="statusText">等待中</span></h3>
        <div class="output-log" id="outputLog">准备就绪，选择模型并点击生成按钮开始...</div>
        <div class="output-result" id="outputResult"></div>
      </div>
    </div>
  </div>
</div>

<script>
const STATE = { selectedModel: null, baseEntry: null, modelConfig: null, images: [], generating: false };
</script>
<script>
// Model categories for sidebar
// 当前公开模型名为连字符格式（veo-3.1-fast-8s-landscape）；旧下划线名（veo_3_1_t2v_*）仍保留分组以兼容老服务。
// 没有被任何分组认领的模型会进入末尾的“其他”，不会再被静默丢弃。
const ASPECTS = ["landscape", "portrait", "square", "four-three", "three-four"];
const ASPECT_LABEL = {
  "landscape": "横屏 16:9", "portrait": "竖屏 9:16", "square": "方图 1:1",
  "four-three": "横屏 4:3", "three-four": "竖屏 3:4",
};
const isLegacyUpsample = m => /^veo_3_1_/.test(m) && /(4k|1080p)$/.test(m);
const isLegacyVideo = (m, kind) => m.startsWith("veo_3_1_" + kind) && !isLegacyUpsample(m);

const MODEL_CATEGORIES = {
  "Gemini 3.1 Flash 图片": { filter: m => m.startsWith("gemini-3.1-flash-image") },
  "Gemini 3.0 Pro 图片": { filter: m => m.startsWith("gemini-3.0-pro-image") },
  "Imagen 4.0 图片": { filter: m => m.startsWith("imagen-4.0") },
  "Veo 3.1 文生视频": { filter: m => /^veo-3\.1-(lite|fast|quality)(-\d+s-(landscape|portrait))?$/.test(m) },
  "Omni 1.1 Flash（文生 / 参考图）": { filter: m => m.startsWith("omni-1.1-flash") },
  "Veo 3.1 首帧 / 首尾帧 (I2V)": { filter: m => /^veo-3\.1-.*-i2v-/.test(m) },
  "Veo 3.1 多图参考 (R2V)": { filter: m => /^veo-3\.1-.*-r2v-/.test(m) },
  "Veo 3.1 视频续写 (Extend)": { filter: m => /^veo-3\.1-.*-extend-/.test(m) },
  "旧名：文生视频 (T2V)": { filter: m => isLegacyVideo(m, "t2v") },
  "旧名：图生视频 (I2V)": { filter: m => isLegacyVideo(m, "i2v") || isLegacyVideo(m, "interpolation") },
  "旧名：多图视频 (R2V)": { filter: m => isLegacyVideo(m, "r2v") },
  "旧名：视频放大 (Upsample)": { filter: isLegacyUpsample },
};
const OTHER_CATEGORY = "其他";

// 无 API Key 或加载失败时的内置候选（与当前公开模型名一致）
const FALLBACK_MODELS = (() => {
  const o = {};
  const ori = ["landscape", "portrait"];
  for (const a of ASPECTS) for (const z of ["", "-2k", "-4k"]) o[`gemini-3.1-flash-image-${a}${z}`] = "Flow Image";
  for (const f of ["lite", "fast", "quality"]) {
    o[`veo-3.1-${f}`] = `Veo 3.1 - ${f} · 8s · landscape`;
    for (const t of [4, 6, 8]) for (const d of ori) o[`veo-3.1-${f}-${t}s-${d}`] = `Veo 3.1 - ${f} · ${t}s · ${d}`;
    for (const t of [4, 6]) for (const d of ori) o[`veo-3.1-${f}-i2v-${t}s-${d}`] = `Veo 3.1 - ${f} I2V · ${t}s · ${d}`;
    for (const d of ori) o[`veo-3.1-${f}-extend-8s-${d}`] = `Veo 3.1 - ${f} Extend · ${d}`;
  }
  for (const f of ["lite", "fast"]) for (const d of ori) o[`veo-3.1-${f}-r2v-8s-${d}`] = `Veo 3.1 - ${f} R2V · 8s · ${d}`;
  o["omni-1.1-flash"] = "Omni 1.1 Flash · 8s · landscape";
  for (const t of [4, 6, 8, 10]) for (const d of ori) o[`omni-1.1-flash-${t}s-${d}`] = `Omni 1.1 Flash · ${t}s · ${d}`;
  return o;
})();

let ALL_MODELS = {};   // 具体模型名 → 描述（显示全部具体模型名时使用）
let BASE_MODELS = {}; // 基础模型 id → {id, type, description, parameters}

// 无 API Key 或加载失败时的内置基础模型（与服务端 /v1/models 默认返回一致）
const FALLBACK_BASE = [
  { id: "gemini-3.1-flash-image", type: "image", description: "Flow image generation. 0-5 images for image-to-image.",
    parameters: { aspectRatio: ["16:9", "9:16", "1:1", "4:3", "3:4"], imageSize: ["1k", "2k", "4k"], images: { min: 0, max: 5 } } },
  ...["lite", "fast", "quality"].map(f => ({
    id: `veo-3.1-${f}`, type: "video",
    description: `Veo 3.1 ${f} video. With 1-2 images: first/last-frame video; 3 images or imageMode=reference: reference video.`,
    parameters: { aspectRatio: ["16:9", "9:16"], durationSeconds: [4, 6, 8], images: { min: 0, max: 3 }, imageMode: ["frames", "reference"] },
  })),
  { id: "omni-1.1-flash", type: "video", description: "Omni 1.1 Flash video. Text-to-video, or reference-image video with 1-3 images.",
    parameters: { aspectRatio: ["16:9", "9:16"], durationSeconds: [4, 6, 8, 10], images: { min: 0, max: 3 } } },
];

const ASPECT_LABELS = {
  "16:9": "16:9 横屏", "9:16": "9:16 竖屏", "1:1": "1:1 方图", "4:3": "4:3 横屏", "3:4": "3:4 竖屏",
};
const IMAGE_SIZE_LABELS = { "1k": "默认 (1k)", "2k": "2K", "4k": "4K" };
const IMAGE_MODE_LABELS = { "": "自动（按图片数量）", "frames": "首帧 / 首尾帧", "reference": "多图参考" };

function applyFallbackModels(reason) {
  console.warn("使用内置候选模型列表:", reason);
  if (document.getElementById("showFull").checked) {
    BASE_MODELS = {};
    ALL_MODELS = { ...FALLBACK_MODELS };
    renderSidebar();
  } else {
    ALL_MODELS = {};
    BASE_MODELS = Object.fromEntries(FALLBACK_BASE.map(m => [m.id, m]));
    renderBaseSidebar();
  }
}

async function loadModels() {
  const baseUrl = (document.getElementById("baseUrl").value || "").trim();
  const apiKey = (document.getElementById("apiKey").value || "").trim();
  if (!baseUrl || !apiKey) {
    applyFallbackModels("missing_base_url_or_api_key");
    return;
  }
  try {
    const full = document.getElementById("showFull").checked;
    const resp = await fetch(`${baseUrl}/v1/models${full ? "?full=1" : ""}`, {
      headers: { "Authorization": `Bearer ${apiKey}` }
    });
    if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    }
    const data = await resp.json();
    const items = Array.isArray(data.data) ? data.data : [];
    if (!items.length) {
      applyFallbackModels("empty_model_catalog");
      return;
    }
    if (!full && items.every(m => m.parameters)) {
      ALL_MODELS = {};
      BASE_MODELS = Object.fromEntries(items.map(m => [m.id, m]));
      renderBaseSidebar();
    } else {
      BASE_MODELS = {};
      ALL_MODELS = {};
      items.forEach(m => { ALL_MODELS[m.id] = m.description; });
      renderSidebar();
    }
  } catch (e) {
    console.error("加载模型失败:", e);
    applyFallbackModels(e.message || "load_failed");
  }
}

function renderSidebarFallback() {
  applyFallbackModels("legacy_fallback");
}

// 基础模型侧边栏：图片 / 视频两组，尺寸、画幅、时长在右侧“生成参数”里选
function renderBaseSidebar() {
  const sidebar = document.getElementById("modelSidebar");
  sidebar.innerHTML = "";
  const entries = Object.values(BASE_MODELS);
  if (!entries.length) {
    sidebar.innerHTML = '<div class="model-section"><div class="model-list" style="border-radius:8px;"><div class="model-item" style="cursor:default;color:#888;">未获取到可用模型，请检查 API Key 或稍后重试</div></div></div>';
    return;
  }
  [["图片", "image"], ["视频", "video"]].forEach(([title, type]) => {
    const models = entries.filter(m => m.type === type);
    if (!models.length) return;
    const section = document.createElement("div");
    section.className = "model-section";
    const head = document.createElement("div");
    head.className = "section-title";
    head.innerHTML = `<span>${title} (${models.length})</span><span class="arrow">▼</span>`;
    const list = document.createElement("div");
    list.className = "model-list";
    models.forEach(m => {
      const item = document.createElement("div");
      item.className = "model-item";
      item.dataset.model = m.id;
      item.title = m.description || m.id;
      item.innerHTML = `<span>${m.id}</span><span class="model-tag ${type === "image" ? "tag-image" : "tag-video"}">${type === "image" ? "图片" : "视频"}</span>`;
      item.onclick = () => selectModel(m.id);
      list.appendChild(item);
    });
    head.onclick = () => { head.classList.toggle("collapsed"); list.classList.toggle("hidden"); };
    section.appendChild(head);
    section.appendChild(list);
    sidebar.appendChild(section);
  });
}

function makeParamSelect(id, label, options, defaultValue, labels) {
  const wrap = document.createElement("label");
  wrap.className = "param-item";
  const caption = document.createElement("span");
  caption.textContent = label;
  const select = document.createElement("select");
  select.id = id;
  options.forEach(value => {
    const opt = document.createElement("option");
    opt.value = String(value);
    opt.textContent = (labels && labels[value]) || String(value);
    if (String(value) === String(defaultValue)) opt.selected = true;
    select.appendChild(opt);
  });
  wrap.appendChild(caption);
  wrap.appendChild(select);
  return wrap;
}

// 按基础模型的 parameters 生成参数控件；具体模型名（兼容模式）不显示
function renderParamFields(entry) {
  const group = document.getElementById("paramGroup");
  const fields = document.getElementById("paramFields");
  const hint = document.getElementById("paramHint");
  fields.innerHTML = "";
  hint.textContent = "";
  if (!entry) { group.style.display = "none"; return; }
  const p = entry.parameters || {};
  if (entry.type === "image") {
    if (p.aspectRatio) fields.appendChild(makeParamSelect("paramAspect", "画幅 aspectRatio", p.aspectRatio, "16:9", ASPECT_LABELS));
    if (p.imageSize) fields.appendChild(makeParamSelect("paramImageSize", "清晰度 imageSize", p.imageSize, "1k", IMAGE_SIZE_LABELS));
    hint.textContent = "对应请求参数 generationConfig.imageConfig.{aspectRatio, imageSize}；OpenAI 风格的 size / quality 也支持。";
  } else {
    if (p.aspectRatio) fields.appendChild(makeParamSelect("paramAspect", "画幅 aspectRatio", p.aspectRatio, "16:9", ASPECT_LABELS));
    if (p.durationSeconds) fields.appendChild(makeParamSelect("paramDuration", "时长（秒）durationSeconds", p.durationSeconds, 8));
    if (p.imageMode) fields.appendChild(makeParamSelect("paramImageMode", "图片用法 imageMode", ["", ...p.imageMode], "", IMAGE_MODE_LABELS));
    hint.textContent = "对应请求参数 generationConfig.videoConfig.{aspectRatio, durationSeconds, imageMode}；首尾帧只支持 4 / 6 秒，多图参考固定 8 秒。";
  }
  group.style.display = "block";
}

// 读取当前参数控件 → generationConfig（具体模型名时返回 null）
function collectGenerationConfig() {
  if (!STATE.baseEntry) return null;
  const val = id => { const el = document.getElementById(id); return el ? el.value : ""; };
  if (STATE.baseEntry.type === "image") {
    const imageConfig = {};
    if (val("paramAspect")) imageConfig.aspectRatio = val("paramAspect");
    if (val("paramImageSize") && val("paramImageSize") !== "1k") imageConfig.imageSize = val("paramImageSize");
    return { imageConfig };
  }
  const videoConfig = {};
  if (val("paramAspect")) videoConfig.aspectRatio = val("paramAspect");
  if (val("paramDuration")) videoConfig.durationSeconds = parseInt(val("paramDuration"), 10);
  if (val("paramImageMode")) videoConfig.imageMode = val("paramImageMode");
  return { videoConfig };
}

function metaFromBase(entry) {
  const images = (entry.parameters && entry.parameters.images) || { min: 0, max: 0 };
  return { type: entry.type, supportsImages: images.max > 0, minImages: images.min || 0, maxImages: images.max || 0 };
}

function getModelType(modelId) {
  if (modelId.includes("image") || modelId.startsWith("imagen")) return "image";
  return "video";
}

function getModelMeta(modelId) {
  // 根据模型名判断是否支持上传图片及数量限制
  const isImage = getModelType(modelId) === "image";
  if (isImage) return { type: "image", supportsImages: true, minImages: 0, maxImages: 5 };
  if (/(^|[-_])(i2v|interpolation)([-_]|$)/.test(modelId)) return { type: "video", supportsImages: true, minImages: 1, maxImages: 2 };
  if (/(^|[-_])r2v([-_]|$)/.test(modelId)) return { type: "video", supportsImages: true, minImages: 1, maxImages: 3 };
  if (modelId.startsWith("omni-1.1-flash")) return { type: "video", supportsImages: true, minImages: 0, maxImages: 3 };
  return { type: "video", supportsImages: false, minImages: 0, maxImages: 0 };
}

// 侧边栏显示名：把 landscape / four-three 等翻译成中文，完整模型名放在 title 悬浮提示和右侧面板标题里
function modelLabel(modelId) {
  const alias = modelId.match(/^(?:veo-3\.1-(lite|fast|quality)|omni-1\.1-(flash))$/);
  if (alias) return `${alias[1] || alias[2]}（默认别名 · 8s 横屏）`;
  const sizeM = modelId.match(/-(2k|4k)$/);
  const base = sizeM ? modelId.slice(0, -3) : modelId;
  const aspect = ASPECTS.find(k => base.endsWith("-" + k));
  if (!aspect) return modelId;
  const head = base.slice(0, -(aspect.length + 1));
  const parts = [];
  if (/^(gemini|imagen)/.test(modelId)) {
    parts.push(ASPECT_LABEL[aspect]);
  } else {
    const rest = head.replace(/^(veo-3\.1|omni-1\.1)-/, "").replace(/-(i2v|r2v|extend)(?=-|$)/, "");
    parts.push(...rest.split("-").filter(Boolean), ASPECT_LABEL[aspect]);
  }
  if (sizeM) parts.push(sizeM[1].toUpperCase());
  return parts.join(" · ");
}

// 侧边栏排序：lite < fast < quality，时长从短到长，横屏在前；图片按画幅再按清晰度
function modelSortKey(modelId) {
  const fam = ["lite", "fast", "quality", "flash"].findIndex(f => modelId.includes("-" + f));
  const secs = parseInt((modelId.match(/-(\d+)s-/) || [])[1] || "0", 10);
  const aspect = ASPECTS.findIndex(k => modelId.includes("-" + k));
  const size = modelId.endsWith("-4k") ? 2 : modelId.endsWith("-2k") ? 1 : 0;
  return [fam, secs, aspect, size];
}
function compareModels(x, y) {
  const kx = modelSortKey(x), ky = modelSortKey(y);
  for (let i = 0; i < kx.length; i++) if (kx[i] !== ky[i]) return kx[i] - ky[i];
  return x.localeCompare(y);
}

function renderSidebar() {
  const sidebar = document.getElementById("modelSidebar");
  sidebar.innerHTML = "";

  const modelIds = Object.keys(ALL_MODELS).sort();
  if (modelIds.length === 0) {
    sidebar.innerHTML = '<div class="model-section"><div class="model-list" style="border-radius:8px;"><div class="model-item" style="cursor:default;color:#888;">未获取到可用模型，请检查 API Key 或稍后重试</div></div></div>';
    return;
  }

  const claimed = new Set();
  const categories = Object.entries(MODEL_CATEGORIES).map(([name, def]) => {
    const list = modelIds.filter(m => !claimed.has(m) && def.filter(m)).sort(compareModels);
    list.forEach(m => claimed.add(m));
    return [name, list];
  });
  const others = modelIds.filter(m => !claimed.has(m)).sort(compareModels);
  if (others.length) categories.push([OTHER_CATEGORY, others]);

  for (const [catName, models] of categories) {
    if (models.length === 0) continue;

    const section = document.createElement("div");
    section.className = "model-section";

    const title = document.createElement("div");
    title.className = "section-title";
    title.innerHTML = `<span>${catName} (${models.length})</span><span class="arrow">▼</span>`;

    const list = document.createElement("div");
    list.className = "model-list";

    models.forEach(modelId => {
      const item = document.createElement("div");
      item.className = "model-item";
      item.dataset.model = modelId;

      const type = getModelType(modelId);
      item.title = modelId;
      const shortName = modelLabel(modelId);
      item.innerHTML = `<span>${shortName}</span><span class="model-tag ${type === 'image' ? 'tag-image' : 'tag-video'}">${type === 'image' ? '图片' : '视频'}</span>`;
      item.onclick = () => selectModel(modelId);
      list.appendChild(item);
    });

    title.onclick = () => {
      title.classList.toggle("collapsed");
      list.classList.toggle("hidden");
    };

    section.appendChild(title);
    section.appendChild(list);
    sidebar.appendChild(section);
  }
}

function selectModel(modelId) {
  STATE.selectedModel = modelId;
  STATE.baseEntry = BASE_MODELS[modelId] || null;
  STATE.modelConfig = STATE.baseEntry ? metaFromBase(STATE.baseEntry) : getModelMeta(modelId);
  STATE.images = [];
  renderParamFields(STATE.baseEntry);

  // Update sidebar active state
  document.querySelectorAll(".model-item").forEach(el => {
    el.classList.toggle("active", el.dataset.model === modelId);
  });

  // Update panel
  document.getElementById("selectedModelName").textContent = modelId;
  let info = (STATE.baseEntry ? STATE.baseEntry.description : ALL_MODELS[modelId]) || "";
  if (/-extend-/.test(modelId)) info += "（续写需要已有视频作为输入，此测试页暂不支持传入源视频）";
  document.getElementById("selectedModelInfo").textContent = info;

  // Show/hide image upload
  const uploadGroup = document.getElementById("imageUploadGroup");
  const meta = STATE.modelConfig;
  if (meta.supportsImages) {
    uploadGroup.style.display = "block";
    const limitText = meta.type === "image" ? "可选，用于图生图" : `${meta.minImages}-${meta.maxImages}张`;
    document.getElementById("imageLimit").textContent = `(${limitText})`;
  } else {
    uploadGroup.style.display = "none";
  }

  // Reset image previews
  document.getElementById("imagePreviewList").innerHTML = "";
  document.getElementById("imageHint").style.display = "block";

  // Enable button
  const btn = document.getElementById("btnGenerate");
  btn.disabled = false;
  btn.textContent = meta.type === "image" ? "🎨 生成图片" : "🎬 生成视频";
}

// Image upload handling
const uploadArea = document.getElementById("imageUploadArea");
const fileInput = document.getElementById("imageFileInput");

uploadArea.onclick = (e) => {
  if (e.target.closest(".remove-btn")) return;
  fileInput.click();
};

uploadArea.ondragover = (e) => { e.preventDefault(); uploadArea.style.borderColor = "#7c8aff"; };
uploadArea.ondragleave = () => { uploadArea.style.borderColor = "#2a2b3a"; };
uploadArea.ondrop = (e) => {
  e.preventDefault();
  uploadArea.style.borderColor = "#2a2b3a";
  handleFiles(e.dataTransfer.files);
};

fileInput.onchange = () => { handleFiles(fileInput.files); fileInput.value = ""; };

function handleFiles(files) {
  const maxImages = STATE.modelConfig ? STATE.modelConfig.maxImages : 5;
  for (const file of files) {
    if (STATE.images.length >= maxImages) break;
    if (!file.type.startsWith("image/")) continue;

    const reader = new FileReader();
    reader.onload = (e) => {
      STATE.images.push(e.target.result);
      renderImagePreviews();
    };
    reader.readAsDataURL(file);
  }
}

function renderImagePreviews() {
  const list = document.getElementById("imagePreviewList");
  const hint = document.getElementById("imageHint");
  list.innerHTML = "";
  hint.style.display = STATE.images.length ? "none" : "block";

  STATE.images.forEach((dataUrl, idx) => {
    const item = document.createElement("div");
    item.className = "image-preview-item";
    item.innerHTML = `<img src="${dataUrl}" alt="preview"><button class="remove-btn" onclick="removeImage(${idx})">×</button>`;
    list.appendChild(item);
  });
}

function removeImage(idx) {
  STATE.images.splice(idx, 1);
  renderImagePreviews();
}

// Generation
document.getElementById("btnGenerate").onclick = generate;

async function generate() {
  if (!STATE.selectedModel || STATE.generating) return;

  const baseUrl = (document.getElementById("baseUrl").value || "").trim();
  const apiKey = (document.getElementById("apiKey").value || "").trim();
  const prompt = document.getElementById("promptInput").value.trim();
  if (!prompt) { alert("请输入提示词"); return; }
  if (!apiKey) { alert("请输入 API Key"); return; }
  if (!baseUrl) { alert("请输入服务地址"); return; }

  STATE.generating = true;
  const btn = document.getElementById("btnGenerate");
  btn.disabled = true;
  btn.textContent = "⏳ 生成中...";

  const dot = document.getElementById("statusDot");
  dot.className = "status-dot status-running";
  document.getElementById("statusText").textContent = "生成中...";
  document.getElementById("outputLog").textContent = "";
  document.getElementById("outputResult").innerHTML = "";

  const log = document.getElementById("outputLog");
  const appendLog = (text) => { log.textContent += text; log.scrollTop = log.scrollHeight; };

  // Build messages
  const content = [];
  content.push({ type: "text", text: prompt });
  STATE.images.forEach(dataUrl => {
    content.push({ type: "image_url", image_url: { url: dataUrl } });
  });

  const messages = [{ role: "user", content: content.length === 1 ? prompt : content }];

  const body = { model: STATE.selectedModel, messages, stream: true };
  const generationConfig = collectGenerationConfig();
  if (generationConfig) body.generationConfig = generationConfig;

  const startTime = Date.now();
  appendLog(`[${new Date().toLocaleTimeString()}] 模型: ${STATE.selectedModel}\n`);
  if (body.generationConfig) appendLog(`[${new Date().toLocaleTimeString()}] 参数: ${JSON.stringify(body.generationConfig)}\n`);
  appendLog(`[${new Date().toLocaleTimeString()}] 提示词: ${prompt.substring(0, 100)}${prompt.length > 100 ? '...' : ''}\n`);
  appendLog(`[${new Date().toLocaleTimeString()}] 开始请求...\n`);

  try {
    const resp = await fetch(`${baseUrl}/v1/chat/completions`, {
      method: "POST",
      headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      const errText = await resp.text();
      throw new Error(`HTTP ${resp.status}: ${errText}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let fullContent = "";
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const data = line.slice(6).trim();
        if (data === "[DONE]") continue;

        try {
          const parsed = JSON.parse(data);
          if (parsed.error) {
            appendLog(`\n❌ 错误: ${JSON.stringify(parsed.error)}\n`);
            continue;
          }
          const choices = parsed.choices || [];
          if (choices.length > 0) {
            const delta = choices[0].delta || {};
            const content = delta.reasoning_content || delta.content || "";
            if (content) {
              fullContent += content;
              appendLog(content);
            }
          }
        } catch (e) {
          // skip unparseable chunks
        }
      }
    }

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    appendLog(`\n\n[${new Date().toLocaleTimeString()}] 完成，耗时 ${elapsed}s\n`);

    // Render result
    renderResult(fullContent);
    dot.className = "status-dot status-done";
    document.getElementById("statusText").textContent = `完成 (${elapsed}s)`;

  } catch (e) {
    appendLog(`\n❌ 请求失败: ${e.message}\n`);
    dot.className = "status-dot status-error";
    document.getElementById("statusText").textContent = "失败";
  } finally {
    STATE.generating = false;
    btn.disabled = false;
    const meta = STATE.modelConfig;
    btn.textContent = meta && meta.type === "image" ? "🎨 生成图片" : "🎬 生成视频";
  }
}

function renderResult(content) {
  const resultDiv = document.getElementById("outputResult");
  resultDiv.innerHTML = "";

  // Extract markdown images
  const imgRegex = /!\[.*?\]\((.*?)\)/g;
  let match;
  while ((match = imgRegex.exec(content)) !== null) {
    const img = document.createElement("img");
    img.src = match[1];
    img.alt = "生成结果";
    img.loading = "lazy";
    resultDiv.appendChild(img);
  }

  // Extract video tags
  const videoRegex = /<video[^>]+src=['"]([^'"]+)['"]/gi;
  while ((match = videoRegex.exec(content)) !== null) {
    const video = document.createElement("video");
    video.src = match[1];
    video.controls = true;
    video.autoplay = true;
    video.loop = true;
    resultDiv.appendChild(video);
  }

  // If no media found, show raw text
  if (resultDiv.children.length === 0 && content.trim()) {
    const pre = document.createElement("pre");
    pre.style.cssText = "color:#aaa;font-size:13px;white-space:pre-wrap;word-break:break-all;";
    pre.textContent = content;
    resultDiv.appendChild(pre);
  }
}

// Auto-detect base URL
(function() {
  const baseUrlInput = document.getElementById("baseUrl");
  const apiKeyInput = document.getElementById("apiKey");
  baseUrlInput.value = window.location.origin;
  baseUrlInput.addEventListener("change", loadModels);
  apiKeyInput.addEventListener("change", loadModels);
  document.getElementById("showFull").addEventListener("change", loadModels);
  loadModels();
})();
</script>
